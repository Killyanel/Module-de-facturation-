<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Générateur de facture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf2; --panel:#ffffff; --text:#18222f; --muted:#5d6b7c; --line:#d3dae3;
  --accent:#0f5c8c; --accent-text:#ffffff; --danger:#b3261e; --field:#f6f8fb;
  --sheet:#ffffff; --sheet-text:#18222f; --sheet-muted:#5d6b7c; --sheet-line:#d3dae3; --sheet-tint:#eef3f8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161d; --panel:#192230; --text:#e6edf5; --muted:#9aa9ba; --line:#2b394b;
    --accent:#5eb0e5; --accent-text:#08202f; --danger:#ff8a80; --field:#121a25; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d; --panel:#192230; --text:#e6edf5; --muted:#9aa9ba; --line:#2b394b;
  --accent:#5eb0e5; --accent-text:#08202f; --danger:#ff8a80; --field:#121a25; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding:24px 16px 40px}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
.intro{color:var(--muted);margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:600;padding:0;margin-bottom:8px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
input,select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--text);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--field)}
.line label{margin-bottom:8px}
.line input{background:var(--panel)}
.row4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.line-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;font-size:13px}
button{font:inherit;cursor:pointer;border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.link{border:0;background:none;color:var(--danger);padding:2px 4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.sheet-wrap{overflow-x:auto}
.sheet{background:var(--sheet);color:var(--sheet-text);border:1px solid var(--sheet-line);border-radius:4px;padding:36px;min-width:520px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid #0f5c8c;padding-bottom:16px;margin-bottom:20px}
.sheet h2{margin:0;font-size:30px;letter-spacing:.5px;color:#0f5c8c}
.sheet .meta{text-align:right;color:var(--sheet-muted);font-size:13px}
.sheet .meta strong{color:var(--sheet-text);font-size:15px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.parties small{display:block;color:var(--sheet-muted);font-size:12px;margin-bottom:2px}
.parties div{white-space:pre-line}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--sheet-tint);text-align:right;padding:8px;font-weight:600;font-size:13px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--sheet-line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
.totals{margin:18px 0 0 auto;width:min(320px,100%);font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;padding:5px 0}
.totals .ttc{border-top:2px solid var(--sheet-text);margin-top:6px;padding-top:10px;font-size:18px;font-weight:700}
.empty{color:var(--sheet-muted);text-align:center;padding:22px 0}
.note{color:var(--sheet-muted);font-size:12px;margin-top:26px}

@media print{
  body{background:#fff}
  .panel,.intro,h1,.actions-bar{display:none!important}
  .app{display:block;padding:0}
  .sheet{border:0;box-shadow:none;padding:0;min-width:0}
}
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>Générateur de facture</h1>
    <p class="intro">Remplissez les champs : la facture se met à jour en direct.</p>
    <div class="panel">
      <fieldset>
        <legend>Votre entreprise</legend>
        <label>Nom<input id="vendeur" value="Ma PME" autocomplete="off"></label>
        <label>Adresse<input id="adrVendeur" placeholder="Rue, ville" autocomplete="off"></label>
      </fieldset>
      <fieldset>
        <legend>Client</legend>
        <label>Nom<input id="client" value="Société Exemple SARL" autocomplete="off"></label>
        <label>Adresse<input id="adrClient" placeholder="Rue, ville" autocomplete="off"></label>
      </fieldset>
      <fieldset>
        <legend>Facture</legend>
        <div class="row2">
          <label>Numéro<input id="numero" value="2026-0001" autocomplete="off"></label>
          <label>Date<input id="date" type="date"></label>
        </div>
        <div class="row2">
          <label>Devise
            <select id="devise">
              <option value="FCFA|0">FCFA</option>
              <option value="€|2">Euro (€)</option>
              <option value="$|2">Dollar ($)</option>
            </select>
          </label>
          <label>TVA par défaut (%)<input id="tvaDefaut" type="number" min="0" step="0.1" value="18"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Lignes</legend>
        <div id="lignes"></div>
        <button type="button" id="ajouter">Ajouter une ligne</button>
      </fieldset>
    </div>
  </div>

  <div>
    <div class="actions actions-bar" style="margin-bottom:12px">
      <button type="button" class="primary" id="imprimer">Imprimer ou enregistrer en PDF</button>
      <button type="button" id="exemple">Remplir avec un exemple</button>
    </div>
    <div class="sheet-wrap">
      <div class="sheet" id="sheet" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var lignesEl = $("lignes");
  var compteur = 0;

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function num(v){ var n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; }

  function ajouterLigne(d){
    d = d || {};
    compteur++;
    var div = document.createElement("div");
    div.className = "line";
    div.innerHTML =
      '<div class="line-head"><span>Ligne</span><button type="button" class="link" data-del>Supprimer</button></div>' +
      '<label>Description<input data-f="desc" value="' + esc(d.desc || "") + '" autocomplete="off"></label>' +
      '<div class="row4">' +
      '<label>Quantité<input data-f="qte" type="number" min="0" step="any" value="' + (d.qte != null ? d.qte : 1) + '"></label>' +
      '<label>Prix unitaire HT<input data-f="prix" type="number" min="0" step="any" value="' + (d.prix != null ? d.prix : "") + '"></label>' +
      '<label>Remise (%)<input data-f="remise" type="number" min="0" max="100" step="any" value="' + (d.remise || 0) + '"></label>' +
      '</div>' +
      '<label>TVA de cette ligne (%)<input data-f="tva" type="number" min="0" step="any" value="' + (d.tva != null ? d.tva : $("tvaDefaut").value) + '"></label>';
    div.querySelector("[data-del]").addEventListener("click", function(){ div.remove(); rendre(); });
    lignesEl.appendChild(div);
  }

  function lire(){
    var parts = $("devise").value.split("|");
    var dec = parseInt(parts[1], 10), f = Math.pow(10, dec);
    var lignes = [].map.call(lignesEl.children, function(el){
      var g = function(k){ return el.querySelector('[data-f="' + k + '"]').value; };
      var qte = num(g("qte")), prix = Math.round(num(g("prix")) * f), rem = num(g("remise")) / 100, tva = num(g("tva")) / 100;
      var ht = Math.round(qte * prix * (1 - rem));
      var t = Math.round(ht * tva);
      return {desc: g("desc"), qte: qte, prix: prix, rem: num(g("remise")), tauxTva: num(g("tva")), ht: ht, tva: t};
    });
    return {sym: parts[0], dec: dec, f: f, lignes: lignes};
  }

  function rendre(){
    var d = lire();
    var fmt = function(m){
      return (m / d.f).toLocaleString("fr-FR", {minimumFractionDigits: d.dec, maximumFractionDigits: d.dec}) + "\u00a0" + d.sym;
    };
    var totHT = 0, totTVA = 0;
    d.lignes.forEach(function(l){ totHT += l.ht; totTVA += l.tva; });

    var dateVal = $("date").value;
    var dateAff = dateVal ? new Date(dateVal + "T00:00:00").toLocaleDateString("fr-FR") : "";

    var corps = d.lignes.length ? d.lignes.map(function(l){
      return "<tr><td>" + esc(l.desc || "Sans description") + (l.rem ? "<br><small>Remise " + l.rem + "\u00a0%</small>" : "") + "</td>" +
        "<td>" + l.qte + "</td><td>" + fmt(l.prix) + "</td><td>" + l.tauxTva + "\u00a0%</td><td>" + fmt(l.ht) + "</td></tr>";
    }).join("") : '<tr><td colspan="5" class="empty">Ajoutez une ligne pour commencer.</td></tr>';

    $("sheet").innerHTML =
      '<div class="sheet-top"><h2>FACTURE</h2><div class="meta"><strong>N°\u00a0' + esc($("numero").value) + '</strong><br>' + esc(dateAff) + '</div></div>' +
      '<div class="parties"><div><small>Émetteur</small><strong>' + esc($("vendeur").value) + '</strong>\n' + esc($("adrVendeur").value) + '</div>' +
      '<div><small>Facturé à</small><strong>' + esc($("client").value) + '</strong>\n' + esc($("adrClient").value) + '</div></div>' +
      '<table><thead><tr><th>Description</th><th>Qté</th><th>Prix unitaire HT</th><th>TVA</th><th>Total HT</th></tr></thead><tbody>' + corps + '</tbody></table>' +
      '<div class="totals"><div><span>Total HT</span><span>' + fmt(totHT) + '</span></div>' +
      '<div><span>Total TVA</span><span>' + fmt(totTVA) + '</span></div>' +
      '<div class="ttc"><span>Total TTC</span><span>' + fmt(totHT + totTVA) + '</span></div></div>' +
      '<p class="note">Document généré à titre d’exemple. Vérifiez les mentions légales obligatoires dans votre pays.</p>';
  }

  document.addEventListener("input", rendre);
  $("devise").addEventListener("change", rendre);
  $("ajouter").addEventListener("click", function(){ ajouterLigne(); rendre(); });
  $("imprimer").addEventListener("click", function(){ window.print(); });
  $("exemple").addEventListener("click", function(){
    lignesEl.innerHTML = "";
    ajouterLigne({desc: "Prestation de conseil", qte: 3, prix: 150000, tva: 18});
    ajouterLigne({desc: "Licence logicielle", qte: 1, prix: 499990, remise: 10, tva: 18});
    ajouterLigne({desc: "Formation", qte: 2, prix: 75500, tva: 0});
    rendre();
  });

  $("date").value = new Date().toISOString().slice(0, 10);
  ajouterLigne({desc: "Prestation de conseil", qte: 3, prix: 150000});
  ajouterLigne({desc: "", qte: 1, prix: ""});
  rendre();
})();
</script>
</body>
</html>
